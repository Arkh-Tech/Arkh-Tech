<header class="fixed top-0 left-0 right-0 z-50 border-b border-border bg-background/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="javascript:" class="flex items-center gap-3">
            <img src="./images/ARKH-TECH-GREEN.svg" alt="Logo da empresa Arkh-Tech " class="w-42 -ml-2 sm:ml-0 object-contain"/>
            
        </a>
        
        <nav class="hidden md:flex items-center gap-8">
            @for (link of navLinks; track $index) 
            {
                <a href="javascript:" (click)="homeService.scrollToElement(link.link)" class="text-sm text-muted-foreground hover:text-primary transition-colors duration-200">
                    {{link.label}}
                </a>
            }
            <a href="javascript:" (click)="homeService.scrollToElement('contact')"   class="inline-flex items-center gap-2 px-4 py-2 rounded-sm bg-primary text-primary-foreground text-sm font-semibold hover:bg-accent transition-colors duration-200">
                Fale Conosco
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right w-3.5 h-3.5"><path d="m9 18 6-6-6-6"></path></svg>
            </a>
        </nav>
        
        <button class="md:hidden text-foreground" (click)="open.set(!open())"  aria-label="Toggle menu">
            @if (!open()) 
            {
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu w-5 h-5"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
            }
            @else 
            {
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x w-5 h-5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            }
        </button>
    </div>
    
    @if(open())
    {
        <div class="md:hidden bg-card border-t border-border px-6 py-6 flex flex-col gap-5">
            @for (link of navLinks; track $index) 
            {
                <a href="javascript:" (click)="clickMenuMobile(link.link)" class="text-foreground hover:text-primary transition-colors text-sm font-medium">
                    {{link.label}}
                </a>
            }
            
            <a href="javascript:" (click)="clickMenuMobile('contact')" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-sm bg-primary text-primary-foreground text-sm font-semibold">
                Fale Conosco
            </a>
        </div>
        

    }
    
</header>
