<section id="technologies" class="py-28">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-16">
            <p class="text-primary text-xs font-semibold tracking-widest uppercase mb-3">
                Stack técnica
            </p>
            <h2 class="font-barlow-condensed text-5xl md:text-6xl font-black text-foreground leading-none">
                TECNOLOGIAS
            </h2>
        </div>
        
        <div class="flex flex-wrap gap-3">
            @for (stack of techStackList; track $index) 
            {
                <div class="px-5 py-3 border border-border rounded-sm text-sm font-mono text-muted-foreground hover:text-primary hover:border-primary/40 hover:bg-primary/5 transition-all duration-200 cursor-default">
                    {{stack}}
                </div>
            }
        </div>
        
    </div>
    
</section>
