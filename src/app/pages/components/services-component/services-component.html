<section id="services" class="py-28">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-16">
            <p class="text-primary text-xs font-semibold tracking-widest uppercase mb-3">
                O que fazemos
            </p>
            <h2 class="font-barlow-condensed text-5xl md:text-6xl font-black text-foreground leading-none">
                NOSSAS SOLUÇÕES
            </h2>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-border">
            @for (service of servicesList; track $index) 
            {
                <div class="bg-background p-10 group hover:bg-card transition-colors duration-300">
                    <div [innerHTML]="service.icon" class="mb-6 inline-flex items-center justify-center w-12 h-12 rounded-sm border border-primary/20 bg-primary/5 group-hover:bg-primary/10 transition-colors"></div>
                    <h3 class="font-barlow-condensed text-3xl font-black text-foreground mb-3 leading-none">
                        {{service.title}}
                    </h3>
                    <p class="text-muted-foreground text-sm leading-relaxed mb-6">
                        {{service.description}}
                    </p>
                    <div class="flex flex-wrap gap-2">
                        @for (tag of service.tags; track $index) 
                        {
                            <span class="px-2.5 py-1 text-xs font-mono text-primary/80 border border-primary/20 rounded-sm bg-primary/5">
                                {{tag}}
                            </span>
                        }
                    </div>
                    
                </div>
                
            }
        </div>
        
        
    </div>
    
</section>
