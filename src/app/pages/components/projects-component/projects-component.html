<section id="projects" class="py-28 bg-card border-y border-border">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-16 flex flex-col md:flex-row md:items-end md:justify-between gap-6">
            <div>
                <p class="text-primary text-xs font-semibold tracking-widest uppercase mb-3">
                    Projetos em destaque
                </p>
                <h2 class="font-barlow-condensed text-5xl md:text-6xl font-black text-foreground leading-none">
                    SOLUÇÕES QUE
                    <br/>
                    <span class="text-primary">GANHAM VIDA</span>
                </h2> 
            </div>
            <p class="text-muted-foreground leading-relaxed max-w-md md:text-right">
                Produtos digitais pensados para transformar desafios reais em
                experiências simples, eficientes e escaláveis.
            </p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            @for (project of projects; track $index) 
            {
                <article class="group border border-border bg-background rounded-sm overflow-hidden hover:border-primary/40 transition-colors duration-300">
                    <div class="relative aspect-16/10 overflow-hidden border-b border-border">
                        <img [src]="project.image" alt="Interface do projeto {{project.title}} para {{project.client}}" class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-500"/>
                        <div class="absolute top-4 left-4 px-2.5 py-1 bg-background/90 backdrop-blur-sm border border-primary/20 rounded-sm">
                            <span class="text-primary text-[0.625rem] font-semibold tracking-widest uppercase">
                                {{project.type}}
                            </span>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <div class="flex items-start justify-between gap-5">
                            <div>
                                <!-- <p class="text-muted-foreground text-xs font-medium uppercase tracking-wider mb-2">
                                    Client {{project.client}}
                                </p> -->
                                <h3 class="text-2xl font-black text-foreground leading-tight">
                                    {{project.title}}
                                </h3>
                            </div>
                            <div class="mt-1 w-9 h-9 shrink-0 rounded-full border border-border flex items-center justify-center text-muted-foreground group-hover:text-primary group-hover:border-primary/30 group-hover:bg-primary/5 transition-all duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right w-4 h-4"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-border flex items-center justify-between">
                            <!-- <span class="text-muted-foreground text-xs">
                                Projeto {{"0"+($index+1)}}
                            </span> -->
                            <span class="w-8 h-px bg-primary/50"></span>
                        </div>
                        
                    </div>
                </article>
            }
        </div>
    </div>
</section>
