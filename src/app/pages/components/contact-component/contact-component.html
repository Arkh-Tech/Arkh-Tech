<section id="contact" class="py-28 bg-card border-t border-border">
    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-16">
        <div>
            <p class="text-primary text-xs font-semibold tracking-widest uppercase mb-3">
                Contato
            </p>
            <h2 class="font-barlow-condensed text-5xl md:text-6xl font-black text-foreground leading-none mb-8">
                VAMOS
                <br/>
                <span class="text-primary">
                    CONVERSAR
                </span>
            </h2>
            <p class="text-muted-foreground leading-relaxed mb-10 max-w-sm">
                Tem um projeto em mente? Quer saber mais sobre nossas soluções?
                Entre em contato e responderemos em até 24 horas.
            </p>
            
            <div class="space-y-4">
                @for (contact of contacts; track $index) 
                {
                    <a [href]="contact.href" target="_blank" rel="noopener noreferrer" class="flex items-center gap-4 p-4 border border-border rounded-sm text-sm font-mono text-muted-foreground hover:text-primary hover:border-primary/40 hover:bg-primary/5 transition-all duration-200">
                        <div [innerHTML]="contact.icon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" ></div>
                        
                        <div>
                            <p class="text-muted-foreground" style="font-size: 11px; margin-bottom: 2px;">
                                {{contact.label}} 
                            </p>
                            <p class="font-barlows font-semibold text-[#d0d0f0]" style="font-size: 14px;">
                                {{contact.value}}
                            </p>
                            
                        </div>
                        
                    </a>
                } 
        
            </div>
            
        </div>
    </div>
</section>
